<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Client-side LLM Chat</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header>
      <h1>Client-side LLM Chat</h1>
      <p class="subtitle">Runs entirely in your browser — no server, no API key.</p>
    </header>

    <div class="controls">
      <div class="control-group">
        <label for="provider">Provider</label>
        <select id="provider">
          <option value="webllm">WebLLM (tiny open-weight model, WebGPU)</option>
          <option value="transformers">Transformers.js (tiny ONNX model, WASM/WebGPU)</option>
          <option value="caption">Transformers.js (image captioning)</option>
          <option value="chrome">Chrome built-in Gemini Nano</option>
        </select>
      </div>

      <div class="control-group" id="model-group">
        <label for="model" id="model-label">Model</label>
        <select id="model"></select>
      </div>

      <button id="load-btn">Load model</button>
    </div>

    <div id="status" class="status" role="status"></div>

    <div id="chat" class="chat" aria-live="polite"></div>

    <form id="chat-form" class="chat-form">
      <div id="text-controls" class="input-mode">
        <input id="chat-input" type="text" placeholder="Say something..." autocomplete="off" disabled />
        <button id="send-btn" type="submit" disabled>Send</button>
      </div>
      <div id="image-controls" class="input-mode hidden">
        <input id="image-input" type="file" accept="image/*" class="file-input" disabled />
        <label id="image-label" for="image-input" class="upload-btn">Choose an image…</label>
      </div>
    </form>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
